<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2330" />
    <title>ProPair</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="ProPair.Web.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/longpress.js"></script>
    <!-- plain name: the fingerprint placeholder is not replaced when the API project publishes the app -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
