<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d2330">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7385"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#f6f7f9"/>

  <!-- ============ left: how the tree is searched ============ -->
  <text x="24" y="34" font-size="16" font-weight="700">How the game tree is searched</text>
  <text x="24" y="54" fill="#6b7385">Every hidden step is a small zero-sum game.</text>
  <text x="24" y="70" fill="#6b7385">Each cell = value of everything that follows.</text>

  <g>
    <rect x="24" y="88" width="380" height="54" rx="10" fill="#fff" stroke="#dde1e8"/>
    <text x="40" y="111" font-weight="700">1 · Defender</text>
    <text x="40" y="129" fill="#6b7385">our k players × their k players (8×8)</text>
    <line x1="214" y1="142" x2="214" y2="162" stroke="#6b7385" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="24" y="164" width="380" height="54" rx="10" fill="#fff" stroke="#dde1e8"/>
    <text x="40" y="187" font-weight="700">2 · Attacker</text>
    <text x="40" y="205" fill="#6b7385">our pairs × their pairs (up to 21×21)</text>
    <line x1="214" y1="218" x2="214" y2="238" stroke="#6b7385" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="24" y="240" width="380" height="54" rx="10" fill="#fff" stroke="#dde1e8"/>
    <text x="40" y="263" font-weight="700">3 · Choice</text>
    <text x="40" y="281" fill="#6b7385">who we take × who they take (2×2)</text>
    <line x1="214" y1="294" x2="214" y2="314" stroke="#6b7385" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="24" y="316" width="380" height="54" rx="10" fill="#e9f6ec" stroke="#2e9e44"/>
    <text x="40" y="339" font-weight="700">2 matchups fixed → next round with k − 2</text>
    <text x="40" y="357" fill="#6b7385">with 3 or 4 left: rest paired directly</text>

    <!-- loop back to the next round -->
    <path d="M404 343 C 450 343, 450 115, 410 115" fill="none" stroke="#2e9e44" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="458" y="229" fill="#2e9e44" font-size="12" transform="rotate(90 458 229)" text-anchor="middle">recursive, memoised</text>
  </g>

  <text x="24" y="398" font-weight="700">Every game is solved:</text>
  <text x="24" y="416" fill="#6b7385">Nash equilibrium = best mix for both sides,</text>
  <text x="24" y="432" fill="#6b7385">neither side can improve by deviating.</text>
  <text x="24" y="448" fill="#6b7385">Result: value, probabilities, most likely path.</text>

  <!-- ============ right: 3v3 example ============ -->
  <text x="500" y="34" font-size="16" font-weight="700">Example 3 vs 3</text>

  <!-- rating matrix -->
  <text x="500" y="62" font-weight="700">Our matrix</text>
  <g font-size="12" text-anchor="middle" fill="#6b7385">
    <text x="625" y="84">Xaver DL</text><text x="685" y="84">Yuri HbE</text><text x="745" y="84">Zoe KoE</text>
  </g>
  <g font-size="12" fill="#6b7385">
    <text x="500" y="112">Anna OK</text><text x="500" y="152">Ben SE</text><text x="500" y="192">Carl VC</text>
  </g>
  <g font-weight="800" text-anchor="middle">
    <rect x="598" y="92" width="54" height="34" rx="6" fill="#2e9e44"/><text x="625" y="114">+</text>
    <rect x="658" y="92" width="54" height="34" rx="6" fill="#f39a3d"/><text x="685" y="114">0/-</text>
    <rect x="718" y="92" width="54" height="34" rx="6" fill="#f2d54b"/><text x="745" y="114">0</text>
    <rect x="598" y="132" width="54" height="34" rx="6" fill="#d9423a"/><text x="625" y="154">-</text>
    <rect x="658" y="132" width="54" height="34" rx="6" fill="#9fd86b"/><text x="685" y="154">0/+</text>
    <rect x="718" y="132" width="54" height="34" rx="6" fill="#9fd86b"/><text x="745" y="154">0/+</text>
    <rect x="598" y="172" width="54" height="34" rx="6" fill="#f2d54b"/><text x="625" y="194">0</text>
    <rect x="658" y="172" width="54" height="34" rx="6" fill="#f2d54b"/><text x="685" y="194">0</text>
    <rect x="718" y="172" width="54" height="34" rx="6" fill="#f39a3d"/><text x="745" y="194">0/-</text>
  </g>
  <text x="790" y="114" font-size="11" fill="#6b7385">+ = +2</text>
  <text x="790" y="130" font-size="11" fill="#6b7385">0/+ = +1</text>
  <text x="790" y="146" font-size="11" fill="#6b7385">0 = 0</text>
  <text x="790" y="162" font-size="11" fill="#6b7385">0/- = −1</text>
  <text x="790" y="178" font-size="11" fill="#6b7385">- = −2</text>

  <!-- defender game -->
  <text x="500" y="242" font-weight="700">Defender step, solved</text>
  <text x="500" y="259" font-size="12" fill="#6b7385">Cell = expected final score if these two defend</text>
  <g font-size="12" text-anchor="middle" fill="#6b7385">
    <text x="625" y="272">Xaver</text><text x="685" y="272">Yuri</text><text x="745" y="272">Zoe</text>
    <text x="625" y="286" fill="#1d2330" font-weight="700">40 %</text>
    <text x="685" y="286" fill="#1d2330" font-weight="700">60 %</text>
    <text x="745" y="286">0 %</text>
  </g>
  <g font-size="12" fill="#6b7385">
    <text x="500" y="310">Anna</text><text x="500" y="346">Ben</text><text x="500" y="382">Carl</text>
  </g>
  <g text-anchor="middle" font-weight="700">
    <rect x="598" y="290" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="625" y="310">−2</text>
    <rect x="658" y="290" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="685" y="310">+2</text>
    <rect x="718" y="290" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="745" y="310">+2</text>
    <rect x="598" y="326" width="54" height="30" rx="6" fill="#fff" stroke="#2e9e44" stroke-width="2"/><text x="625" y="346">+1</text>
    <rect x="658" y="326" width="54" height="30" rx="6" fill="#fff" stroke="#2e9e44" stroke-width="2"/><text x="685" y="346">0</text>
    <rect x="718" y="326" width="54" height="30" rx="6" fill="#fff" stroke="#2e9e44" stroke-width="2"/><text x="745" y="346">+1</text>
    <rect x="598" y="362" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="625" y="382" fill="#6b7385">−2</text>
    <rect x="658" y="362" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="685" y="382" fill="#6b7385">0</text>
    <rect x="718" y="362" width="54" height="30" rx="6" fill="#fff" stroke="#dde1e8"/><text x="745" y="382" fill="#6b7385">+0.5</text>
  </g>
  <g font-size="12" font-weight="700">
    <text x="782" y="310">20 %</text>
    <text x="782" y="346" fill="#2e9e44">80 %  ★</text>
    <text x="782" y="382" fill="#6b7385">0 %</text>
  </g>

  <rect x="500" y="404" width="436" height="50" rx="10" fill="#fff" stroke="#dde1e8"/>
  <text x="514" y="425"><tspan font-weight="700">Fair expected +0.4.</tspan> Ben defends: safe ≥ 0.</text>
  <text x="514" y="443" fill="#6b7385">Pessimistic (opponent sees our move) it would only be 0.</text>
</svg>
