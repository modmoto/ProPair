# Build pipeline. Name it "pro-pair.build" in Azure DevOps (release-pipeline.yml refers to that name).
name: $(Build.BuildID)

jobs:
  - job: build_and_test
    pool:
      vmImage: "ubuntu-latest"

    steps:
      - task: qetza.replacetokens.replacetokens-task.replacetokens@3
        displayName: 'Replace tokens'
        inputs:
          targetFiles: |
            **/*.token.yml => *.yml

      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '11.0.x'

      - task: DotNetCoreCLI@2
        displayName: 'restore'
        inputs:
          command: 'restore'
          feedsToUse: 'select'

      - task: DotNetCoreCLI@2
        displayName: 'build'
        inputs:
          command: 'build'

      - task: DotNetCoreCLI@2
        displayName: 'unit tests'
        inputs:
          command: 'test'
          projects: '**/*Tests.csproj'

      - task: Docker@2
        displayName: 'docker build and push'
        # only main, only when the tests passed
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: 'official-docker-modmoto'
          repository: 'modmoto/pro-pair'
          command: 'buildAndPush'
          Dockerfile: '**/Dockerfile'
          buildContext: '.'
          tags: |
            $(Build.BuildID)
            latest

      - task: CopyFiles@2
        displayName: publish docker-compose files
        inputs:
          contents: '**/*docker-compose.yml'
          targetFolder: $(Build.ArtifactStagingDirectory)

      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
